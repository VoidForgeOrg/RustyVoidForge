[package]
name = "voidforge-server"
description = "API, token checks, accounts and the leaderboard job"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# The universe bootstrap, `seed` (P2.9, D-043); token checks (P3.2, D-046): axum's extractor,
# jsonwebtoken for the signature, reqwest for dex's keys, api-types for the error body.
axum.workspace = true
clap.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
voidforge-api-types.workspace = true
voidforge-rules.workspace = true
voidforge-store.workspace = true
voidforge-telemetry.workspace = true
voidforge-worldgen.workspace = true

[dev-dependencies]
# The database-stage tests boot the host on a seeded database (P2.9, D-043); api_codes checks the
# API's game codes against the core's (P3.1, D-045); the token tests generate RSA keys with
# aws-lc-rs (P3.2, D-046), so no private key is committed.
aws-lc-rs.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
voidforge-core.workspace = true
voidforge-host.workspace = true
voidforge-testkit.workspace = true

[lints]
