[package]
name = "voidforge-web"
description = "Server-rendered HTML frontend and OIDC login; reaches the server only over HTTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# Login (P4.1, D-057): our own authorization code flow with PKCE. jsonwebtoken checks the ID
# token (as the server does, D-046); aws-lc-rs, already its backend, draws state, nonce and the
# verifier and hashes the challenge; base64 encodes them. reqwest talks to dex and the API,
# tower-sessions keeps the session in our own bounded store (async-trait for its trait), maud renders the pages, clap reads the config.
async-trait.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
jsonwebtoken.workspace = true
maud.workspace = true
reqwest = { workspace = true, features = ["form"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tower-sessions.workspace = true
tracing.workspace = true
voidforge-api-types.workspace = true
voidforge-telemetry.workspace = true

[dev-dependencies]
# The login tests (D-057) capture every tracing event to prove nothing secret is logged, as the
# server's account tests do (D-047). Already in this crate's tree through telemetry.
tracing-subscriber.workspace = true
# The pages' HTML snapshots (P4.3, D-060), each beside a by-effect assertion (T4); pinned in the
# workspace, as the server's contract snapshots use it.
insta.workspace = true

[lints]
workspace = true
