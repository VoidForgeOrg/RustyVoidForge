[package]
name = "voidforge-bots"
description = "Scripted players for end-to-end and nightly runs, plus a terminal client with device code login"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# The end-to-end scenario (P3.6, D-052): clap for the command line, reqwest and tokio for HTTP,
# api-types for every request and answer, serde for dex's token response, and serde_json to decode
# a reply after reading its text, so a failure can print what the server really said.
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
voidforge-api-types.workspace = true
voidforge-telemetry.workspace = true

[dev-dependencies]
# Paused time for the wait tests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
