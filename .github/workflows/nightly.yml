# The nightly runs (Technical Plan P5.3; decision log D-066): the bot simulation, crash-and-retry
# and the golden replays in a release build, each with a job summary; then `report`, which opens or
# comments on one issue per failing run kind (nightly-issue.sh). Not a required check: a red night
# opens an issue. Every run also runs locally: `just nightly-sim`, `just nightly-crash`,
# `just nightly-golden`. A pull request that changes the nightly's own files runs it on its head;
# only the schedule or a manual dispatch ever reports to issues.
# Action and tool versions are pinned; see docs/versions.md and decision log D-007.
name: Nightly

on:
  # 03:17 UTC, off the hour, when GitHub's scheduled queue is lightest.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      sim_minutes:
        description: The bot simulation's wall minutes, 1 to 300 (a minute plays 60 v0 hours)
        default: "30"
      crash_seeds:
        description: File-store crash seeds (Postgres runs VOIDFORGE_CRASH_PG_SEEDS, default 100)
        default: "1000"
      force_fail:
        description: Fail one run on purpose, to prove the issue path (its issue title says so)
        type: choice
        default: none
        options: [none, sim, crash, golden]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/nightly.yml
      - .github/scripts/nightly-*
      - .github/scripts/test-nightly-issue.sh
      - .github/scripts/test-nightly-latency.py
      - .github/scripts/check-nightly.py
      - crates/voidforge-host/tests/crash.rs
      - crates/voidforge-host/tests/nightly.rs
      - crates/voidforge-bots/src/sim.rs
      - crates/voidforge-bots/src/sim/**

permissions:
  contents: read

# One group for every run that reports (the schedule and dispatches, on any ref), so two reports
# never race on the same issue title (R2-4). A pull request's run never reports, so it has its own
# group and can't displace a queued night (GitHub cancels an older pending run in a group).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('nightly-pr-{0}', github.ref) || 'nightly' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Eight bots play through the API against serve on the fast rules (30 min: about 10.7 v0 weeks),
  # then the log is replayed from its snapshots, the core's invariants are checked after every
  # record, and the step latency is read from serve's histograms through Grafana's Prometheus.
  sim:
    name: sim
    runs-on: ubuntu-24.04
    # The play time plus ~50 minutes for the build and the post-run checks (~4 measured), so a longer
    # manual run (A2) doesn't time out and read as a failed night (QA's B2). 80 for the default 30.
    timeout-minutes: ${{ fromJSON(inputs.sim_minutes || '30') + 50 }}
    outputs:
      started: ${{ steps.run.outputs.started || steps.forced.outputs.started }}
      outcome: ${{ steps.run.outputs.outcome || steps.forced.outputs.outcome }}
    env:
      DEX_CONFIG: config.ci.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: forced failure (workflow_dispatch input)
        id: forced
        if: github.event_name == 'workflow_dispatch' && inputs.force_fail == 'sim'
        run: |
          echo "started=1" >> "$GITHUB_OUTPUT"
          echo "outcome=failed" >> "$GITHUB_OUTPUT"
          echo "::error::forced failure: workflow_dispatch's force_fail is sim"
          exit 1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
      - name: Postgres, dex (CI config) and the collector, healthy
        id: stack
        run: docker compose -f deploy/compose.yaml up --build --detach --wait --wait-timeout 300 postgres dex otel-lgtm
      - name: Bot simulation
        id: run
        env:
          SIM_MINUTES: ${{ inputs.sim_minutes || '30' }}
          SIM_SEED: ${{ github.run_number }}
          # p99 bounds in seconds (the lead's T3, D-066): ~10x the measured p99, with a floor. The
          # step's measured p99 is the histograms' lowest bucket edge, so it guards large regressions only.
          SIM_STEP_P99_MAX: "0.05"
          SIM_APPEND_P99_MAX: "0.25"
        run: |
          echo "started=1" >> "$GITHUB_OUTPUT"
          status=0
          .github/scripts/nightly-sim.sh || status=$?
          case "$status" in 0) outcome=passed ;; 3) outcome=infra ;; *) outcome=failed ;; esac
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: On failure, the logs (the bots, serve, replay, invariants, latency)
        if: failure() && steps.run.outcome == 'failure'
        run: |
          for f in target/nightly/sim/*.log target/nightly/sim/*.out; do
            echo "::group::$f"
            tail -200 "$f" 2>/dev/null || echo "(no $f)"
            echo "::endgroup::"
          done

  # The host killed at seeded points, retries converging to one outcome per command: the file
  # store's seeds, then Postgres's through the database stage (voidforge_test and _sqlx_test_* only).
  # Each night starts at a new seed base; a red seed reruns locally from the summary's numbers.
  crash:
    name: crash
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      started: ${{ steps.run.outputs.started || steps.forced.outputs.started }}
      outcome: ${{ steps.run.outputs.outcome || steps.forced.outputs.outcome }}
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: voidforge
          POSTGRES_PASSWORD: voidforge-local-test-password
          POSTGRES_DB: voidforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=voidforge --dbname=voidforge_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://voidforge:voidforge-local-test-password@localhost:5432/voidforge_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: forced failure (workflow_dispatch input)
        id: forced
        if: github.event_name == 'workflow_dispatch' && inputs.force_fail == 'crash'
        run: |
          echo "started=1" >> "$GITHUB_OUTPUT"
          echo "outcome=failed" >> "$GITHUB_OUTPUT"
          echo "::error::forced failure: workflow_dispatch's force_fail is crash"
          exit 1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
      - name: Crash and retry (file store, then Postgres)
        id: run
        env:
          # The job context (the service container's ID) is available to steps, not to job-level env.
          PSQL: docker exec -i ${{ job.services.postgres.id }} psql -U voidforge
          VOIDFORGE_CRASH_SEEDS: ${{ inputs.crash_seeds || '1000' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "started=1" >> "$GITHUB_OUTPUT"
          export VOIDFORGE_CRASH_SEED_BASE=$(( 1000 + RUN_NUMBER * 10000 ))
          status=0
          .github/scripts/nightly-crash.sh || status=$?
          case "$status" in 0) outcome=passed ;; 3) outcome=infra ;; *) outcome=failed ;; esac
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          exit "$status"

  # The three golden checks every PR runs in debug, in a release build; never blesses.
  golden:
    name: golden
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      started: ${{ steps.run.outputs.started || steps.forced.outputs.started }}
      outcome: ${{ steps.run.outputs.outcome || steps.forced.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: forced failure (workflow_dispatch input)
        id: forced
        if: github.event_name == 'workflow_dispatch' && inputs.force_fail == 'golden'
        run: |
          echo "started=1" >> "$GITHUB_OUTPUT"
          echo "outcome=failed" >> "$GITHUB_OUTPUT"
          echo "::error::forced failure: workflow_dispatch's force_fail is golden"
          exit 1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
      - name: Golden replays, release build
        id: run
        run: |
          echo "started=1" >> "$GITHUB_OUTPUT"
          status=0
          .github/scripts/nightly-golden.sh || status=$?
          case "$status" in 0) outcome=passed ;; 3) outcome=infra ;; *) outcome=failed ;; esac
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          exit "$status"

  # One issue per failing run kind: opened, or commented on; "green again" on a pass; never closed.
  # Never for a pull request. The only job that may write issues.
  report:
    name: report
    needs: [sim, crash, golden]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or comment on the issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Only the kind a dispatch forced is a forced test; the others report to their real issues.
          FORCE_FAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_fail || 'none' }}
          SIM: ${{ needs.sim.result }} ${{ needs.sim.outputs.started || '-' }} ${{ needs.sim.outputs.outcome || '-' }}
          CRASH: ${{ needs.crash.result }} ${{ needs.crash.outputs.started || '-' }} ${{ needs.crash.outputs.outcome || '-' }}
          GOLDEN: ${{ needs.golden.result }} ${{ needs.golden.outputs.started || '-' }} ${{ needs.golden.outputs.outcome || '-' }}
        run: .github/scripts/nightly-report.sh sim crash golden
