# CI baseline (Technical Plan P0.3), plus the database job (P2.1, D-034) and the e2e job (P3.6,
# D-052). All six are required checks on main: the ruleset "main: required CI checks" names lint,
# supply-chain, test, determinism, database and e2e (read 2026-10-21 for P4.5, D-062). The e2e job
# includes the smoke test (`just smoke`'s web walk, P4.5). The images job (P5.2, D-065) runs on every
# PR and isn't required yet: adding it to the ruleset is the owner's change. The web job (D-066)
# builds and tests the browser app in web/; making it required is the owner's ruleset change too.
# Every command here also runs locally from the repository root; see AGENTS.md, Commands.
# Action and tool versions are pinned; see docs/versions.md and decision log D-007.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: No managed blocks in tracked files
        run: .github/scripts/check-no-managed-blocks.sh
      - name: Managed-block check regression cases
        run: .github/scripts/test-check-no-managed-blocks.sh
      - name: dex config parity (CI is local plus exactly the password grant)
        run: .github/scripts/check-dex-parity.sh
      - name: dex parity check regression cases
        run: .github/scripts/test-check-dex-parity.sh
      - name: The web walk serves only its own app (regression cases, D-063 R2-G1)
        run: python3 .github/scripts/test-web-walk-ready.py
      - name: The images' pins and their compose project (P5.2, D-065)
        run: python3 .github/scripts/check-images.py --static
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy, warnings as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: No floats in core, rules and worldgen (type-aware, from MIR)
        run: python3 tests/guardrails/check_no_floats.py
      - name: Bots dependency isolation
        run: python3 tests/guardrails/check_bots_deps.py
      - name: Guardrail fixtures (determinism bans and bots isolation)
        run: python3 tests/guardrails/run_fixtures.py

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2
      - name: cargo-deny (licenses, advisories, bans and dependency allowlist, sources)
        run: cargo deny check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: npm audit (the web app's locked dependencies)
        run: npm audit --prefix web

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
      - name: Unit and property tests
        run: cargo nextest run --workspace --locked

  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the locked dependencies
        run: npm ci
      - name: The generated API client matches openapi.json
        run: npm run gen:api && git diff --exit-code src/api/schema.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  determinism:
    name: determinism
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
      - name: Determinism suite and two-process double run
        run: .github/scripts/determinism.sh

  # The Database tests stage (Technical Plan, CI/CD; decision log D-034): the migrations-only-add
  # guardrail, then .github/scripts/database.sh against a fresh Postgres service (the same image
  # digest as deploy/compose.yaml). `just db-test` runs the same steps against the local stack.
  database:
    name: database
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: voidforge
          POSTGRES_PASSWORD: voidforge-local-test-password
          POSTGRES_DB: voidforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --host=127.0.0.1 --username=voidforge --dbname=voidforge_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://voidforge:voidforge-local-test-password@localhost:5432/voidforge_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the migrations guardrail compares against the base commit
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
      - name: Install sqlx-cli (no install-action manifest; a locked build, kept by rust-cache)
        run: cargo install sqlx-cli@0.9.0 --locked --no-default-features --features postgres
      - name: Migrations only add
        run: .github/scripts/check-migrations-only-add.sh "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
      - name: Migrations guardrail regression cases
        run: .github/scripts/test-check-migrations-only-add.sh
      - name: Database-stage lock regression cases
        run: .github/scripts/test-database-lock.sh
        env:
          PSQL: docker exec -i ${{ job.services.postgres.id }} psql -U voidforge
      - name: Migrations on an empty database twice, the sqlx metadata check, store tests
        run: .github/scripts/database.sh
        env:
          # The job context (the service container's ID) is available to steps, not to job-level env.
          PSQL: docker exec -i ${{ job.services.postgres.id }} psql -U voidforge

  # The end-to-end scenario (Technical Plan P3.6, the Phase 3 gate; decision log D-052): compose's
  # Postgres and dex with the CI dex config (the password grant on), then .github/scripts/e2e.sh,
  # which seeds a fresh universe on the fast rules, runs the serve binary on the host and the
  # bots against it, then the web walk in Chromium (D-066). Then the token checks against the
  # real dex (D-046). `just e2e` and `just dex-test` run the same against the local stack.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEX_CONFIG: config.ci.yaml
      E2E_LOG_DIR: ${{ github.workspace }}/target/e2e/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: The web app's locked dependencies, and Playwright's Chromium for the web walk
        run: |
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
      - name: Postgres and dex (CI config), healthy
        run: docker compose -f deploy/compose.yaml up --build --detach --wait --wait-timeout 300 postgres dex
      - name: Build the server and the bots
        run: SQLX_OFFLINE=true cargo build --locked -p voidforge-server -p voidforge-bots
      - name: The end-to-end scenario
        run: .github/scripts/e2e.sh
      - name: Token checks against the real dex
        run: SQLX_OFFLINE=true cargo nextest run -p voidforge-server --test dex --locked --run-ignored only --no-capture
      - name: On failure, the logs (serve, the bots, the terminal login, the web walk, seed, dex, Postgres)
        if: failure()
        run: |
          for f in serve bots device-login web-walk web seed; do
            echo "::group::$f.log"
            cat "$E2E_LOG_DIR/$f.log" 2>/dev/null || echo "(no $f.log)"
            echo "::endgroup::"
          done
          echo "::group::dex and Postgres"
          docker compose -f deploy/compose.yaml logs --no-color dex postgres
          echo "::endgroup::"

  # The server and web images (P5.2, D-065), built and pushed nowhere: no registry, no login, no
  # secrets. Then both under compose, healthy (the advisor's A1), and the smoke test against them
  # (`just smoke-images`), against compose's Postgres and dex with the CI config, as the e2e job.
  # It needs no Rust toolchain: everything builds inside the images.
  images:
    name: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEX_CONFIG: config.ci.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build both images (dockerfiles/Dockerfile)
        run: |
          docker info --format 'docker {{.ServerVersion}}, storage driver {{.Driver}}, {{.OperatingSystem}}'
          started=$(date +%s)
          for target in server web; do
            docker build -f dockerfiles/Dockerfile --target "$target" --build-arg CARGO_BUILD_JOBS=4 \
              --build-arg VOIDFORGE_GIT_SHA="${GITHUB_SHA::12}" -t "voidforge-$target:local" .
          done
          echo "both images built in $(( $(date +%s) - started )) s"
      - name: The built images' checks (user, size, nothing but the binary)
        run: python3 .github/scripts/check-images.py --built
      - name: Postgres and dex (CI config), healthy
        run: docker compose -f deploy/compose.yaml up --build --detach --wait --wait-timeout 300 postgres dex
      - name: Both images under compose, healthy, stopped cleanly
        run: .github/scripts/images-compose.sh
        env:
          E2E_LOG_DIR: ${{ github.workspace }}/target/e2e/images-compose
      - name: The smoke test against the images
        run: .github/scripts/e2e.sh --images --smoke
        env:
          E2E_LOG_DIR: ${{ github.workspace }}/target/e2e/images-smoke
      - name: On failure, the logs (compose, serve, the walk, the web, seed, dex, Postgres)
        if: failure()
        run: |
          for f in target/e2e/images-compose/*.log target/e2e/images-smoke/*.log; do
            echo "::group::$f"
            cat "$f" 2>/dev/null || echo "(no $f)"
            echo "::endgroup::"
          done
          echo "::group::dex and Postgres"
          docker compose -f deploy/compose.yaml logs --no-color dex postgres
          echo "::endgroup::"
