[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
repository = "https://github.com/VoidForgeOrg/RustyVoidForge"

[workspace.dependencies]
# Library crates only: a binary crate cannot be a dependency (decision log D-003).
voidforge-api-types = { path = "crates/voidforge-api-types", version = "0.1.0" }
voidforge-core = { path = "crates/voidforge-core", version = "0.1.0" }
voidforge-host = { path = "crates/voidforge-host", version = "0.1.0" }
voidforge-rules = { path = "crates/voidforge-rules", version = "0.1.0" }
voidforge-store = { path = "crates/voidforge-store", version = "0.1.0" }
voidforge-telemetry = { path = "crates/voidforge-telemetry", version = "0.1.0" }
voidforge-testkit = { path = "crates/voidforge-testkit", version = "0.1.0" }
voidforge-worldgen = { path = "crates/voidforge-worldgen", version = "0.1.0" }

# External crates: exact pins (Technical Plan, Tech stack); each has a decision-log entry and a
# version-table row, and passes the deny.toml allowlist.
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
rand_chacha = { version = "=0.9.0", default-features = false }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
thiserror = "=2.0.21"
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
tracing = "=0.1.44"
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "registry"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
