# dex for CI end-to-end runs. It is config.yaml plus the password grant for the static test users
# (Technical Plan, Auth); keep the two files identical otherwise. TEST-ONLY values throughout.
# Select it with DEX_CONFIG=config.ci.yaml.

# One issuer for the browser, the host and host-network containers (decision log D-015).
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true
  responseTypes: ["code"]
  # Authorization code (with PKCE) for the web app, device code for bots and the CLI.
  # CI only: the password grant for the static test users. Still no client credentials.
  grantTypes:
    - authorization_code
    - refresh_token
    - urn:ietf:params:oauth:grant-type:device_code
    - password
  passwordConnector: local

enablePasswordDB: true
