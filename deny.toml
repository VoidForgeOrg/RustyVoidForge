# cargo-deny policy: licenses, advisories, sources and the dependency allowlist.
# A new dependency is added to [bans].allow and its license to [licenses].allow,
# together with a decision-log entry (docs/decision-log.md, D-008).

[graph]
all-features = true
# Only the platforms the project builds and runs on: CI and images (Linux) and developer
# machines (macOS). Crates needed only on other targets (wasm, Windows) are not checked.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Each license is added with the first dependency that needs it (decision log D-017).
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are unpublished (publish = false) and carry no license field.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# The dependency allowlist. Once it is non-empty, cargo-deny rejects every crate
# not listed, workspace crates included.
allow = [
    { crate = "voidforge-api-types" },
    { crate = "voidforge-bots" },
    { crate = "voidforge-core" },
    { crate = "voidforge-host" },
    { crate = "voidforge-replay" },
    { crate = "voidforge-rules" },
    { crate = "voidforge-server" },
