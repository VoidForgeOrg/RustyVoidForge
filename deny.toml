    # voidforge-telemetry (P0.6, decision log D-017): its direct dependencies
    { crate = "opentelemetry" },
    { crate = "opentelemetry-otlp" },
    { crate = "opentelemetry_sdk" },
    { crate = "thiserror" },
    { crate = "tracing" },
