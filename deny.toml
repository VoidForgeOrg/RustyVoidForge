# cargo-deny policy: licenses, advisories, sources and the dependency allowlist.
# A new dependency is added to [bans].allow and its license to [licenses].allow,
# together with a decision-log entry (docs/decision-log.md, D-008).

[graph]
all-features = true
# Only the platforms the project builds and runs on: CI and images (Linux) and developer
# machines (macOS). Crates needed only on other targets (wasm, Windows) are not checked.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Each license is added with the first dependency that needs it (decision log D-017).
# MIT-0 (borrow-or-share, through jsonschema; P3.1, decision log D-045) is MIT without the
# attribution clause: OSI-approved and more permissive.
# ISC and BSD-3-Clause (aws-lc-rs, aws-lc-sys, untrusted; P3.2, decision log D-046): both
# permissive and OSI-approved.
allow = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT", "MIT-0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are unpublished (publish = false) and carry no license field.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
